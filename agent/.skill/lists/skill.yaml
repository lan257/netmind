skills:
  - skill_id: skill_creation_guide
    skill_name: Skill 创建指南
    description: 指导 Agent 创建 prompt-only Skill；Skill 只沉淀提示、流程和维护约束，不包含 run.py 或可执行参数。
    trigger: 当用户要求创建新的 Skill、沉淀可复用工作流、补充 AI 行为规范或扩展提示型能力时使用。
    prompt: 创建 Skill 前先确认目标是否只需要提示和流程。如果需要执行代码、读写文件或调用外部接口，应改用 Tool 创建指南。基本流程只创建一个 Skill 文件夹，文件夹内包含 skill_definition.json、workflow.md、maintenance.md，且不得包含 run.py、params、permission、script_path 等可执行字段。写入较长文本时使用 long_text_line_modifier_guide 分块批量写入。
    workflow_path: workflow.md
    maintenance_path: maintenance.md
    category: Skill管理
    tags: skill, 创建, prompt-only
  - skill_id: skill_update_guide
    skill_name: Skill 修改指南
    description: 指导 Agent 修改 prompt-only Skill，并校验单个 Skill 文件夹内的定义、流程和维护文档一致。
    trigger: 当用户要求修改已有 Skill 的触发条件、提示、流程、维护说明、分类或标签时使用。
    prompt: 修改 Skill 时只维护一个 Skill 文件夹，先读取其中的 skill_definition.json、workflow.md、maintenance.md。保持 Skill 为 prompt-only；如果变更引入可执行能力，应转入 Tool 修改或 Tool 创建。写入较长文本时使用 long_text_line_modifier_guide 分块批量写入，不手动改 .skill 列表。
    workflow_path: workflow.md
    maintenance_path: maintenance.md
    category: Skill管理
    tags: skill, 修改, 一致性校验
  - skill_id: tool_creation_guide
    skill_name: Tool 创建指南
    description: 指导 Agent 创建 executable Tool；Tool 才能包含 run.py、参数、权限和运行时脚本。
    trigger: 当用户要求创建可执行工具、封装文件操作、调用接口、运行脚本、返回结构化运行结果或新增可被 Agent 调用的动作能力时使用。
    prompt: 创建 Tool 时只创建一个 Tool 文件夹，文件夹内准备 tool_definition.json、run.py、tool.md。Tool 定义必须声明 params、permission_level、permission_message、script_path；规范 script_path 指向对应 .tool/tools/<tool_id>/run.py。写入较长文本时使用 long_text_line_modifier_guide 分块批量写入。不要把可执行 Tool 做成 Skill。
    workflow_path: workflow.md
    maintenance_path: maintenance.md
    category: Tool管理
    tags: tool, 创建, executable
  - skill_id: tool_update_guide
    skill_name: Tool 修改指南
    description: 指导 Agent 修改 executable Tool，并保持单个 Tool 文件夹内的定义、脚本、文档和权限一致。
    trigger: 当用户要求修改已有 Tool 的功能、参数、权限、脚本逻辑、文档说明、分类或标签时使用。
    prompt: 修改 Tool 时只维护一个 Tool 文件夹，先读取其中的 tool_definition.json、run.py、tool.md。参数、权限、文档和实现必须同步更新；写入较长文本时使用 long_text_line_modifier_guide 分块批量写入，不手动改 .tool 列表。不要把 prompt-only Skill 的 workflow 写进 Tool 作为替代实现。
    workflow_path: workflow.md
    maintenance_path: maintenance.md
    category: Tool管理
    tags: tool, 修改, 一致性校验
  - skill_id: long_text_line_modifier_guide
    skill_name: 长文本分块文件编辑指南
    description: 指导 Agent 在 line_modifier 单次写入受限时，把长文本写入或大段文件编辑拆成多次小块调用，并控制行号与校验。
    trigger: 当需要用 line_modifier 写入超过单次 40 行或 4000 字符的长文本、批量编辑文件、分段追加内容或拆分大范围文件修改时使用。
    prompt: 长文本文件编辑仍优先使用 line_modifier。先用 line_reader 获取目标范围和总行数，再把内容拆成每块目标范围、新内容均不超过 40 行且 new_content 不超过 4000 字符的 line_modifier 调用；行号能稳定推算时可在同一次 tool_call_drafts 中请求多次调用，插入或删除导致后续行号不确定时先执行前一批并重读锚点。不要因为内容很长改用整文件覆盖。
    workflow_path: workflow.md
    maintenance_path: maintenance.md
    category: 文件操作
    tags: 文件编辑, 长文本, 批量调用, line_modifier
